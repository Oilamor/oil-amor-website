<!doctype html><html><body style="margin:0">
<canvas id="c" width="720" height="450"></canvas>
<script>
const gl = document.getElementById('c').getContext('webgl');
const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const FS = 'precision mediump float;uniform float u_time;void main(){gl_FragColor=vec4(abs(sin(u_time)),0.2,0.5,1.);}';
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.log('COMPILE:',gl.getShaderInfoLog(x));return x;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
const uT=gl.getUniformLocation(pr,'u_time');
function frame(now){gl.uniform1f(uT,now/1000);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
